<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Öffentliche Auftragstafel · Zauberreise</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px;background:radial-gradient(circle at top,#42351f,#151712 62%);color:#f2e7ca;font:16px/1.5 Georgia,serif}.wrap{max-width:1050px;margin:auto}.hero,.card{border:1px solid #9d7a3f;background:#211f18e8;box-shadow:0 16px 45px #0008}.hero{padding:30px;text-align:center}.hero h1{margin:0;color:#efc86f}.hero p{color:#c7b894}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:18px}.card{padding:20px}.card h2{margin:0 0 12px;color:#e4bd67;font-size:1.2rem}.entry{padding:10px 0;border-top:1px solid #725b3566}.entry:first-of-type{border:0}.muted{color:#a99e87}.bar{height:10px;margin-top:7px;overflow:hidden;border-radius:9px;background:#090b09}.bar i{display:block;height:100%;background:linear-gradient(90deg,#9d332d,#ef884c)}nav{margin:18px 0;text-align:center}a{color:#f0ca73}code{color:#ffe6a7}#error{color:#ffb0a8}</style></head>
<body><main class="wrap"><section class="hero"><h1>📌 Öffentliche Auftragstafel</h1><p>Gemeinsame Gefahren, Rettungen, Kopfgelder und die Spuren vergangener Reisen. Die Ansicht aktualisiert sich automatisch.</p><div id="updated" class="muted">Live-Stand wird geladen …</div><div id="error"></div></section><nav><a href="schenke.html">Zur Schenke</a> · <a href="lobby.html">Zur Gruppenlobby</a></nav><section class="grid"><article class="card" id="boss"></article><article class="card"><h2>🆘 Offene Rettungen</h2><div id="rescues"></div></article><article class="card"><h2>📜 Kopfgelder</h2><div id="bounties"></div></article><article class="card"><h2>🗺️ Weltspuren</h2><div id="traces"></div></article><article class="card"><h2>🪦 Grabstätten</h2><div id="graves"></div></article></section></main>
<script>const endpoint="https://zauberreise-live.d4wizzard.workers.dev",tavernId="736368656e6b65000000000000000000",esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function rows(a,fn,empty){return (a||[]).length?(a||[]).map(fn).join(""):`<p class="muted">${empty}</p>`}async function load(){try{const r=await fetch(`${endpoint}/api/state/${tavernId}`,{cache:"no-store"});if(!r.ok)throw new Error(`HTTP ${r.status}`);const payload=await r.json(),s=payload.state||payload,b=s.PublicBoard||{},boss=b.WorldBoss||{};document.getElementById("updated").textContent="Stand: "+new Intl.DateTimeFormat("de-DE",{dateStyle:"medium",timeStyle:"medium",timeZone:"Europe/Berlin"}).format(new Date(b.UpdatedUtc||Date.now()));const pct=Number(boss.MaxHp)>0?Math.max(0,Math.min(100,Number(boss.Hp)/Number(boss.MaxHp)*100)):0;document.getElementById("boss").innerHTML=`<h2>🌍 Weltboss</h2><strong>${esc(boss.Name||"Zurzeit kein Weltboss")}</strong><p>${Number(boss.Hp)||0}/${Number(boss.MaxHp)||0} LP · Stufe ${Number(boss.Level)||0}</p><div class="bar"><i style="width:${pct}%"></i></div><p><code>!zr weltboss angriff</code></p>`;document.getElementById("rescues").innerHTML=rows(b.Rescues,n=>`<div class="entry">@${esc(n)} wartet auf vollständige Heilung oder Rettung.</div>`,"Niemand benötigt gerade Rettung.");document.getElementById("bounties").innerHTML=rows(b.Bounties,x=>`<div class="entry"><b>#${Number(x.Number)} ${esc(x.Name)}</b><br>${esc(x.Reward)} · <code>!zr kopfgeld ${Number(x.Number)}</code></div>`,"Keine Kopfgelder ausgeschrieben.");document.getElementById("traces").innerHTML=rows(b.WorldTraces||s.WorldTraces,x=>`<div class="entry"><b>@${esc(x.Player)} · ${esc(x.Place)}</b><br>${esc(x.Deed)}</div>`,"Noch keine dauerhafte Weltspur.");document.getElementById("graves").innerHTML=rows(b.Graves,x=>`<div class="entry">${esc(x.Name||x.PlayerName||"Unbekannte Grabstätte")}</div>`,"Keine offene Grabstätte.");document.getElementById("error").textContent=""}catch(e){document.getElementById("error").textContent="Live-Daten sind vorübergehend nicht erreichbar: "+e.message}}load();setInterval(load,8000);</script></body></html>
