<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zauberreise · Live-Abenteuer</title><style>
:root{--ink:#f4ead3;--gold:#e2b85f;--red:#b34b45;--green:#5f9677;--panel:#171b22e8}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Georgia,serif;background:radial-gradient(circle at top,#334052,#11151c 65%)}main{width:min(1220px,calc(100% - 28px));margin:auto;padding:28px 0}header{text-align:center;padding:22px;border:1px solid #816d4d;background:#111720dd}h1{margin:5px;color:var(--gold);font-size:clamp(2rem,5vw,4rem)}#meta{color:#c9bda8}.initiative{margin:18px 0;padding:15px;border:1px solid #806d4e;background:#25212c}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{padding:18px;border:1px solid #665b4b;background:var(--panel)}h2{margin-top:0;color:var(--gold)}.card{margin:10px 0;padding:13px;border-left:4px solid var(--red);background:#fff1}.card.ally{border-color:var(--green)}.head{display:flex;justify-content:space-between;gap:12px;font-weight:bold}.bar{height:9px;margin-top:8px;background:#06090d}.bar i{display:block;height:100%;background:var(--red)}.ally .bar i{background:var(--green)}small{color:#bcb3a4}.log{margin-top:18px}.log p{padding:8px 0;border-bottom:1px solid #ffffff18}.paused{color:#ffca75;font-weight:bold}footer{text-align:center;margin-top:20px;color:#a9a08f}@media(max-width:760px){.columns{grid-template-columns:1fr}}
</style></head><body><main><header><small>DIE CHRONIKEN DER ZAUBERREISE</small><h1>Live-Abenteuer</h1><div id="meta">Verbindung wird hergestellt …</div></header><div class="initiative" id="initiative"></div><section class="columns"><article class="panel"><h2>Gegner</h2><div id="enemies"></div></article><article class="panel"><h2>Gruppe & Verbündete</h2><div id="allies"></div></article></section><section class="panel log"><h2>Chronik des laufenden Kampfes</h2><div id="log"></div></section><footer>Aktualisierung alle 5 Sekunden · Nur öffentliche Spieldaten</footer></main><script>
const q=new URLSearchParams(location.search),id=q.get("live"),api="https://zauberreise-live.d4wizzard.workers.dev",esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),pct=(a,b)=>Math.max(0,Math.min(100,b?Number(a)/Number(b)*100:0));
function render(p,updated){const a=p.SheetAdventure||{},enemies=a.Enemies||[],allies=a.Allies||[];document.getElementById("meta").innerHTML=`<b>${esc(a.Place||"Schenke")}</b> · Runde ${Number(a.Round)||0} · Formation ${esc(a.Formation||"standard")}${a.Paused?' · <span class="paused">PAUSIERT</span>':""} · ${new Date((Number(updated)||0)*1000).toLocaleTimeString("de-DE")}`;document.getElementById("initiative").innerHTML=`<b>Initiative:</b> ${(a.InitiativeOrder||[]).map(esc).join(" → ")||"Noch nicht ausgewürfelt"}`;document.getElementById("enemies").innerHTML=enemies.map((e,i)=>{const insight=Number(e.Insight)||0,life=insight?`${Number(e.Hp)||0}/${Number(e.MaxHp)||0} LP`:"Zustand noch unbekannt",details=insight<1?"Fähigkeiten unbekannt":`Gefahr ${Number(e.Danger)||1}/6${insight>=2&&e.Ability?" · "+esc(e.Ability):""}${insight>=3?` · Schwäche ${esc(e.Weakness||"?")} · Resistenz ${esc(e.Resistance||"?")}`:""}`;return `<div class="card"><div class="head"><span>#${i+1} ${esc(e.Name||"Unbekannt")}</span><span>${life}</span></div><div class="bar"><i style="width:${pct(e.Hp,e.MaxHp)}%"></i></div><small>Wissen ${insight}/3 · ${details}</small></div>`}).join("")||"Keine aktiven Gegner.";document.getElementById("allies").innerHTML=allies.map(x=>`<div class="card ally"><div class="head"><span>${x.IsLeader?"♛ ":""}@${esc(x.Name)}${x.IsSelf?" · eigener Bogen":""}</span><span>${Number(x.Hp)||0}/${Number(x.MaxHp)||0} LP</span></div><div class="bar"><i style="width:${pct(x.Hp,x.MaxHp)}%"></i></div><small>${esc(x.CharacterClass||"Klasse offen")}${x.Role?" · "+esc(x.Role):""} · ${esc(x.State||"kampfbereit")}${x.Companion?" · 🐾 "+esc(x.Companion.Name||x.Companion.Type)+" "+Number(x.Companion.Hp||0)+"/"+Number(x.Companion.MaxHp||0)+" LP":""}</small></div>`).join("")||"Keine Gruppe erfasst.";document.getElementById("log").innerHTML=(a.CombatLog||[]).map(x=>`<p>${esc(x)}</p>`).join("")||"Der Chronist wartet auf die erste Aktion."}
async function refresh(){if(!id||!/^[a-f0-9]{32}$/i.test(id)){document.getElementById("meta").textContent="Ungültige Live-Kennung";return}try{const r=await fetch(`${api}/api/state/${id}`,{cache:"no-store"});if(!r.ok)throw new Error(r.status);const d=await r.json();render(d.state,d.updatedAt)}catch(e){document.getElementById("meta").textContent="Live-Stand ist noch nicht verfügbar."}}refresh();setInterval(refresh,5000);
</script></body></html>
