<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Öffentliche temporäre Gruppenlobby der Zauberreise"><title>Zauberreise · Gruppenlobby</title><style>
:root{--gold:#e3ba65;--ink:#f5ead2;--muted:#c5b9a5;--panel:#1b2027ee;--green:#67a17f}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Georgia,serif;background:radial-gradient(circle at top,#493743,#11151b 68%)}main{width:min(1050px,calc(100% - 28px));margin:auto;padding:34px 0}header{text-align:center;padding:28px;border:1px solid #7f6a48;background:#111821dd}h1{margin:6px;color:var(--gold);font-size:clamp(2rem,6vw,4rem)}#state{color:var(--muted)}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:20px}.group{padding:20px;border:1px solid #746349;border-left:5px solid var(--green);background:var(--panel);box-shadow:0 14px 35px #0006}.group h2{margin:0 0 7px;color:var(--gold)}.group p{color:var(--muted)}.tag{display:inline-block;margin:3px;padding:5px 8px;border:1px solid #8b785b;background:#293039;font:700 .72rem Arial,sans-serif}.missing{border-color:#a65e57;color:#ffd5cf}.join{display:block;margin-top:14px;padding:10px;color:#102219;background:var(--green);font-weight:bold}footer{text-align:center;margin-top:22px;color:var(--muted)}a{color:var(--gold)}:focus-visible{outline:3px solid #f2d37e;outline-offset:3px}@media(max-width:520px){main{width:min(100% - 16px,1050px);padding:12px 0}.group{padding:15px}}
</style></head><body><main><header><small>DIE CHRONIKEN DER ZAUBERREISE</small><h1>Temporäre Gruppenlobby</h1><p>Hier erscheinen nur Gruppen des aktuellen Abenteuers – es entstehen keine dauerhaften Spielergruppen.</p><div id="state">Live-Verbindung wird hergestellt …</div></header><section class="groups" id="groups"></section><footer><a href="schenke.html">Zur Verzauberten Schenke</a> · Aktualisierung alle 8 Sekunden</footer></main><script>
const api="https://zauberreise-live.d4wizzard.workers.dev",id="736368656e6b65000000000000000000",esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function render(list=[]){document.getElementById("state").textContent=list.length?list.length+" aktive Gruppenbanner":"Zurzeit wartet kein offenes Gruppenbanner";document.getElementById("groups").innerHTML=list.map(g=>`<article class="group"><h2>♛ @${esc(g.Leader)}</h2><b>${Number(g.Members)||0}/${Number(g.MaxMembers)||4} Plätze · ${esc(g.State)}</b><p>Ort: ${esc(g.Place||"Schenke")}</p><div>${(g.Classes||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("")||'<span class="tag">Klassen noch offen</span>'}</div>${(g.MissingClasses||[]).length?`<p>Empfohlene Verstärkung:</p><div>${g.MissingClasses.map(x=>`<span class="tag missing">${esc(x)}</span>`).join("")}</div>`:""}<code class="join">!zauberreise gruppe beitreten @${esc(g.Leader)}</code></article>`).join("")||'<article class="group"><h2>🍻 Die Bänke sind noch frei</h2><p>Eröffne im Twitch-Chat ein neues, nur für dieses Abenteuer bestehendes Banner.</p><code class="join">!zauberreise gruppe erstellen</code></article>'}async function refresh(){try{const r=await fetch(`${api}/api/state/${id}`,{cache:"no-store"});if(!r.ok)throw new Error(r.status);const d=await r.json();render(d.state?.Lobby||[])}catch(e){document.getElementById("state").textContent="Live-Stand vorübergehend nicht erreichbar"}}refresh();setInterval(refresh,8000);
</script></body></html>
