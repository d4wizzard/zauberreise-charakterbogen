<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerüchtetafel</title><style>body{margin:0;background:#17120d;color:#2d2015;font:17px Georgia,serif}header{text-align:center;color:#f5dfb5;background:#0e0c0a;padding:25px}.board{max-width:1000px;margin:35px auto;padding:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:25px;background:#6b4323;border:18px ridge #8d6236}.note{min-height:180px;padding:24px;background:#ead49b;box-shadow:4px 7px 12px #0008;transform:rotate(-1deg)}.note:nth-child(even){transform:rotate(1.5deg)}.done{background:#cbe4ad}.check{color:green;font-size:25px}</style></head><body><header><h1>🕯️ Gerüchtetafel der Schenke</h1><div id="meta"></div></header><main class="board" id="board"></main><script>const api="https://zauberreise-live.d4wizzard.workers.dev",id=new URLSearchParams(location.search).get("live"),titles={silbermond:"Die Treppe des Silbermondes","schwarzer-brunnen":"Der schwarze Brunnen","singender-hain":"Der singende Hain","aschene-treppe":"Die aschene Treppe"};async function load(){if(!id)return;try{const r=await fetch(`${api}/api/state/${id}`,{cache:"no-store"}),p=(await r.json()).state||{},rum=p.Rumors||{},dis=p.Discoveries||[];document.getElementById("meta").textContent=`Hinweise von @${p.Name||"Abenteurer"}`;document.getElementById("board").innerHTML=Object.keys(titles).map(k=>{const n=Number(rum[k]||0),done=n>=3;return `<article class="note ${done?"done":""}"><h2>${done?'<span class="check">✓</span> ':""}${titles[k]}</h2><p>Gesammelte Hinweise: ${n}/3</p><p>${done?"Entdeckung entschlüsselt und in der Chronik vermerkt.":n?"Weitere Spuren werden in Schenke und Wildnis gesucht.":"Noch ist dies nur ein Flüstern ohne Beleg."}</p></article>`}).join("")+`<article class="note done"><h2>Entdeckungen</h2><p>${dis.join("<br>")||"noch keine"}</p></article>`}catch{}}load();setInterval(load,10000)</script></body></html>
