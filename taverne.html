<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Die Verzauberte Taverne</title><style>
:root{--gold:#dfb55d;--ink:#f6ead0;--dark:#17151d;--wine:#572d3b}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Georgia,serif;background:radial-gradient(circle at 50% 0,#4d3442,#17151d 58%);min-height:100vh}main{width:min(1050px,calc(100% - 28px));margin:auto;padding:38px 0}header{text-align:center;padding:25px;border:1px solid #856a45;background:rgba(19,14,17,.75)}h1{margin:4px;font-size:clamp(2rem,6vw,4rem);color:var(--gold)}header p{color:#c8b99f}.hall{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}.room{min-height:170px;padding:20px;border:1px solid #705b41;background:linear-gradient(145deg,rgba(95,63,45,.7),rgba(29,28,34,.92));box-shadow:0 12px 28px #0006}.room b{display:block;font-size:1.4rem;color:var(--gold)}.room span{display:block;margin:7px 0 18px;color:#c7baa7}.bar{height:13px;border:1px solid #8e7754;background:#15151a}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8c4b43,#e4ba59)}.locked{filter:saturate(.4);opacity:.7}footer{text-align:center;margin-top:20px;padding:18px;color:#c8b99f;border-top:1px solid #705b41}@media(max-width:650px){.hall{grid-template-columns:1fr}}
</style></head><body><main><header><small>DIE CHRONIKEN DER ZAUBERREISE</small><h1>Die Verzauberte Taverne</h1><p>Von der Gemeinschaft mit Silbermünzen errichtet und über viele Streams hinweg erweitert.</p><strong id="total"></strong></header><section class="hall" id="hall"></section><footer>Ausbau im Twitch-Chat: <code>!zauberreise taverne spenden [Silber] [Bereich]</code></footer></main><script>
const q=new URLSearchParams(location.search),rooms={heilung:["Heilstube","Bessere Genesung, Arzneien und Versorgung von Verletzungen."],handel:["Händlerhof","Günstigere Preise und seltenere Angebote."],auftraege:["Schwarzes Brett","Zusätzliche Tages-, Fraktions- und Gemeinschaftsaufträge."],gruppe:["Großer Schankraum","Mehr Platz für gemeinsam aufbrechende Gruppen."],boten:["Botenstube","Schnellere und zuverlässigere Hilferufe."],stall:["Begleiterstall","Heilung, Ausbildung und Talente für Gefährten."],vorrat:["Vorratskammer","Notrationen und bessere Reiseversorgung."]};
document.getElementById("total").textContent=(Number(q.get("total"))||0)+" Silbermünzen insgesamt gestiftet";document.getElementById("hall").innerHTML=Object.entries(rooms).map(([k,[name,desc]])=>{const l=Math.max(0,Math.min(5,Number(q.get(k))||0));return `<article class="room ${l===0?"locked":""}"><b>${name}</b><span>${desc}</span><p>Ausbaustufe ${l}/5</p><div class="bar"><i style="width:${l*20}%"></i></div></article>`}).join("");
</script></body></html>
