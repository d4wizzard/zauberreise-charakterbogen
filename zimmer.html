<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Persönliches Schenkenzimmer</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b11;color:#f5e8c7;font:16px Georgia,serif}.room{min-height:100vh;padding:32px;background:linear-gradient(#11182b99,#07080ddd),radial-gradient(circle at 50% 35%,#d88d3a66,transparent 30%),linear-gradient(135deg,#35281e,#10131b);overflow:hidden}h1{text-align:center;color:#ffd887}.scene{position:relative;max-width:1050px;height:560px;margin:auto;border:12px solid #352310;border-radius:24px;background:linear-gradient(#27324a 0 55%,#402d1e 56%);box-shadow:inset 0 0 90px #000,0 20px 60px #000}.window{position:absolute;left:44%;top:45px;width:150px;height:170px;border:12px solid #402b18;background:radial-gradient(circle,#d7e8ff,#344b82 60%,#111);animation:moon 5s ease-in-out infinite}.slot{position:absolute;padding:14px;border:1px solid #b3894c;background:#171411dd;border-radius:12px;min-width:170px;text-align:center}.weapon{left:5%;top:90px}.armor{right:5%;top:90px}.trophy{left:7%;bottom:55px}.companion{right:7%;bottom:55px}.chest{left:40%;bottom:24px;font-size:55px;animation:glow 2.5s infinite}.slot b{display:block;color:#ffd887;margin-bottom:8px}.links{text-align:center;margin:20px}.links a{color:#ffd887}@keyframes moon{50%{filter:brightness(1.3);box-shadow:0 0 35px #9bcaff}}@keyframes glow{50%{filter:drop-shadow(0 0 20px gold);transform:translateY(-5px)}}

const api="https://zauberreise-live.d4wizzard.workers.dev",id=new URLSearchParams(location.search).get("live"),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function load(){if(!id)return;try{const r=await fetch(`${api}/api/state/${id}`,{cache:"no-store"}),p=(await r.json()).state||{};document.getElementById("title").textContent=`🏠 ${p.Name||"Abenteurer"}s Schenkenzimmer · Stufe ${p.RoomLevel||Math.max(1,Math.min(5,1+Math.floor((p.Level||1)/4)))}`;document.getElementById("weapon").textContent=p.EquippedWeapon?.Name||"leer";document.getElementById("armor").textContent=p.EquippedArmor?.Name||p.EquippedClothing?.Name||"leer";document.getElementById("trophy").textContent=(p.Titles||[]).slice(0,3).join(" · ")||`${p.BossVictories||0} Boss-Trophäen`;const companionImage=document.getElementById("companionImage");document.getElementById("companion").textContent=p.Companion?`${p.Companion.Name} · ${p.Companion.Type}`:"unbewohnt";if(p.Companion){companionImage.src=`companions/${encodeURIComponent(p.Companion.Type)}.jpg`;companionImage.alt=p.Companion.Name||p.Companion.Type;companionImage.hidden=false}else companionImage.hidden=true;document.getElementById("meta").innerHTML=`${esc((p.Discoveries||[]).slice(0,3).join(" · ")||"Noch keine besonderen Entdeckungen")} · <a href="bestiarium.html?live=${encodeURIComponent(id)}">Bestiarium öffnen</a>`}catch{document.getElementById("meta").textContent="Das Zimmer ist vorübergehend verschlossen."}}load();setInterval(load,10000);
</script></body></html>
