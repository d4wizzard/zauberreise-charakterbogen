<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bestiarium der Zauberreise</title><style>
*{box-sizing:border-box}body{margin:0;color:#efe5ca;background:radial-gradient(circle at 50% 0,#273556,#090d17 58%);font:16px Georgia,serif;min-height:100vh}header{padding:34px;text-align:center;background:linear-gradient(#080b12aa,#080b12ee);border-bottom:1px solid #ad8a47}h1{color:#ffd983;margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:18px;padding:28px;max-width:1200px;margin:auto}.monster{position:relative;overflow:hidden;min-height:285px;padding:20px;border:1px solid #79673f;border-radius:18px;background:linear-gradient(145deg,#242b3d,#111521);box-shadow:0 14px 35px #0008}.portrait{height:130px;display:grid;place-items:center;font-size:76px;filter:drop-shadow(0 0 16px #b667ff);animation:breathe 3.2s ease-in-out infinite}.monster:nth-child(2n) .portrait{animation-delay:-1.3s}.badge{position:absolute;right:14px;top:14px;background:#a33b65;padding:5px 9px;border-radius:20px}.unknown{filter:grayscale(1);opacity:.55}.empty{padding:50px;text-align:center}@keyframes breathe{50%{transform:scale(1.1) translateY(-7px);filter:drop-shadow(0 0 30px #ff5dd9)}}
</style></head><body><header><h1>📚 Bestiarium der Zauberreise</h1><div id="meta">Die Chronisten öffnen die Folianten …</div></header><main id="grid" class="grid"></main><script>
const api="https://zauberreise-live.d4wizzard.workers.dev",id=new URLSearchParams(location.search).get("live"),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),icon=n=>/drache/i.test(n)?"🐉":/wolf/i.test(n)?"🐺":/geist|phantom/i.test(n)?"👻":/golem|wächter/i.test(n)?"🗿":/kobold|wicht/i.test(n)?"👺":/spinne|weber/i.test(n)?"🕷️":"👹",facts=(n,c)=>({weak:c>=3?(/arkan|geist/i.test(n)?"Magie und geweihte Angriffe":"Klassenfähigkeiten und gute Ausrüstung"):"???",loot:c>=5?(/wolf/i.test(n)?"Leder, Proviant":"Silber, Materialien, seltene Ausrüstung"):"???"});
async function load(){if(!id){document.getElementById("meta").textContent="Öffne diese Seite über !bestiarium.";return}try{const r=await fetch(`${api}/api/state/${id}`,{cache:"no-store"});if(!r.ok)throw 0;const p=(await r.json()).state||{},details=p.BestiaryDetails||{},list=Object.entries(details).sort((a,b)=>Number(b[1]?.Defeated||0)-Number(a[1]?.Defeated||0)||Number(b[1]?.Observed||0)-Number(a[1]?.Observed||0)),assigned=list.reduce((sum,[,d])=>sum+Number(d?.Defeated||0),0),historic=Math.max(0,Number(p.DefeatedEnemies||0)-assigned);document.getElementById("meta").textContent=`Persönliche Aufzeichnungen von @${p.Name||"Abenteurer"} · ${list.length} Kreaturenarten${historic?` · ${historic} historische Siege sind aus der Zeit vor der Gegner-Einzelzählung nicht mehr eindeutig zuordenbar`:""}`;document.getElementById("grid").innerHTML=list.length?list.map(([n,d])=>{d=d||{};const observed=Number(d.Observed||0),defeated=Number(d.Defeated||0),tier=Number(d.KnowledgeTier||1);return `<article class="monster ${tier<2?"unknown":""}"><span class="badge">${observed}× beobachtet · ${defeated}× besiegt</span><div class="portrait">${icon(n)}</div><h2>${esc(n)}</h2><p><b>Erkenntnis:</b> ${esc(d.KnowledgeLabel||"bloße Sichtung")} (${Number(d.Knowledge||observed)} Punkte)</p><p><b>Fundorte:</b> ${esc((d.Places||[]).join(" · ")||"unbekannt")}</p><p><b>Gefahr:</b> ${esc(d.DangerLabel||"noch nicht einschätzbar")}${tier>=2&&d.MagicOnly?" · nur magisch verwundbar":""}</p><p><b>LP:</b> ${esc(d.HpDisplay||"???")} · <b>Angriff:</b> ${esc(d.AttackDisplay||"???")}</p><p><b>Fähigkeit:</b> ${esc(d.Ability||"???")}</p><p><b>Schwäche:</b> ${esc(d.Weakness||"???")} · <b>Resistenz:</b> ${esc(d.Resistance||"???")}</p><p><b>Typisches Material:</b> ${esc(d.TypicalMaterial||"???")}</p></article>`}).join(""):'<div class="empty">Noch keine Kreatur erfasst. Eine Sichtung notiert zunächst nur Namen und Fundort.</div>'}catch{document.getElementById("meta").textContent="Der Live-Foliant ist gerade nicht erreichbar."}}load();setInterval(load,10000);
</script></body></html>
