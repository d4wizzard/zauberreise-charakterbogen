<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Die Verzauberte Schenke</title><style>
:root{--gold:#dfb55d;--ink:#f6ead0;--dark:#17151d;--wine:#572d3b}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Georgia,serif;background:radial-gradient(circle at 50% 0,#4d3442,#17151d 58%);min-height:100vh}main{width:min(1050px,calc(100% - 28px));margin:auto;padding:38px 0}.hero{position:relative;min-height:clamp(300px,54vw,560px);overflow:hidden;border:1px solid #856a45;box-shadow:0 18px 42px #0009}.hero img{position:absolute;width:100%;height:100%;object-fit:cover;object-position:center}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#060b1288 0%,transparent 38%,#110e12e8 100%)}.hero-copy{position:absolute;z-index:1;left:clamp(18px,5vw,55px);right:clamp(18px,5vw,55px);bottom:clamp(20px,5vw,48px);text-shadow:0 2px 12px #000}.hero-copy small{letter-spacing:.18em}.hero-copy h1{margin:5px 0;font-size:clamp(2.2rem,6vw,4.5rem);line-height:1;color:var(--gold)}.hero-copy p{max-width:680px;margin:10px 0;color:#eee0c6}.hero-copy strong{color:#fff3cd}.hall{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}.room{min-height:170px;padding:20px;border:1px solid #705b41;background:linear-gradient(145deg,rgba(95,63,45,.7),rgba(29,28,34,.92));box-shadow:0 12px 28px #0006}.room b{display:block;font-size:1.4rem;color:var(--gold)}.room span{display:block;margin:7px 0 18px;color:#c7baa7}.bar{height:13px;border:1px solid #8e7754;background:#15151a}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8c4b43,#e4ba59)}.locked{filter:saturate(.4);opacity:.7}footer{text-align:center;margin-top:20px;padding:18px;color:#c8b99f;border-top:1px solid #705b41}@media(max-width:650px){.hall{grid-template-columns:1fr}.hero{min-height:390px}.hero img{object-position:58% center}}
</style></head><body><main><section class="hero"><img src="schenke-bei-nacht.png" alt="Die Verzauberte Schenke bei Nacht"><div class="hero-copy"><small>DIE CHRONIKEN DER ZAUBERREISE</small><h1>Die Verzauberte Schenke</h1><p>Von der Gemeinschaft mit Silbermünzen errichtet und über viele Streams hinweg erweitert.</p><strong id="total"></strong></div></section><section class="hall" id="hall"></section><footer><a href="haendler.html" style="color:#dfb55d">🏪 Händler und aktuelle Preise</a><br><br>Ausbau im Twitch-Chat: <code>!zauberreise schenke spenden [Silber] [Bereich]</code></footer></main><script>
const q=new URLSearchParams(location.search),rooms={heilung:["Heilstube","Bessere Genesung, Arzneien und Versorgung von Verletzungen."],handel:["Händlerhof","Günstigere Preise und seltenere Angebote."],auftraege:["Schwarzes Brett","Zusätzliche Tages-, Fraktions- und Gemeinschaftsaufträge."],gruppe:["Großer Schankraum","Mehr Platz für gemeinsam aufbrechende Gruppen."],boten:["Botenstube","Schnellere und zuverlässigere Hilferufe."],stall:["Begleiterstall","Heilung, Ausbildung und Talente für Gefährten."],vorrat:["Vorratskammer","Notrationen und bessere Reiseversorgung."]},endpoint="https://zauberreise-live.d4wizzard.workers.dev",tavernId="736368656e6b65000000000000000000";
function render(state={}){const levels=state.Levels||{};document.getElementById("total").textContent=(Number(state.TotalDonated)||0)+" Silbermünzen insgesamt gestiftet · Live-Ansicht";document.getElementById("hall").innerHTML=Object.entries(rooms).map(([k,[name,desc]])=>{const l=Math.max(0,Math.min(5,Number(levels[k])||0)),progress=Math.max(0,Number((state.Progress||{})[k])||0),needed=l<5?(l+1)*100:1,percent=l>=5?100:Math.min(100,progress/needed*100);return `<article class="room ${l===0?"locked":""}"><b>${name}</b><span>${desc}</span><p>Ausbaustufe ${l}/5 · ${l>=5?"vollständig ausgebaut":progress+" / "+needed+" Silber"}</p><div class="bar"><i style="width:${percent}%"></i></div></article>`}).join("")}
function queryFallback(){const state={Levels:{},Progress:{},TotalDonated:Number(q.get("total"))||0};Object.keys(rooms).forEach(k=>state.Levels[k]=Number(q.get(k))||0);return state}
async function refresh(){try{const response=await fetch(`${endpoint}/api/state/${tavernId}`,{cache:"no-store"});if(response.ok)render((await response.json()).state||queryFallback())}catch(e){}}
render(queryFallback());refresh();setInterval(refresh,8000);
</script></body></html>
