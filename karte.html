<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Landkarte der Zauberreise</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#efe4ca;font-family:Georgia,serif;background:#111820}main{width:min(1100px,calc(100% - 28px));margin:auto;padding:30px}h1,h2{text-align:center;color:#e4bd68}h1{font-size:clamp(2rem,5vw,4rem)}.map{position:relative;min-height:680px;border:8px double #846b42;background:radial-gradient(circle at 48% 45%,#8a8059,#4d563e 35%,#263d3b 70%,#18242b);box-shadow:inset 0 0 80px #071015,0 18px 45px #0009}.place{position:absolute;width:165px;padding:12px;text-align:center;border:1px solid #d3ba79;background:#171a1ddd;box-shadow:0 8px 18px #0008}.place b{display:block;color:#f1cf7b}.place span{font-size:.75rem;color:#cfc5b2}.pins{margin-top:7px;color:#ffdc7d!important}.active{outline:4px solid #ffcf5e;animation:pulse 1.6s infinite}.discovered{box-shadow:0 0 0 3px #67bd8b,0 8px 18px #0008}.locked{opacity:.38;filter:grayscale(1)}@keyframes pulse{50%{outline-color:#fff0a8;transform:scale(1.04)}}#status{text-align:center;margin:16px}.discoveries{margin-top:24px;padding:18px;border:2px solid #846b42;background:#171a1dcc}.discoveries ul{margin:0;padding-left:22px}.discoveries li{margin:8px 0;color:#ddd0b5}.p1{left:6%;top:12%}.p2{left:38%;top:8%}.p3{right:6%;top:17%}.p4{left:12%;top:42%}.p5{right:12%;top:44%}.p6{left:8%;bottom:9%}.p7{left:41%;bottom:12%}.p8{right:6%;bottom:7%}@media(max-width:700px){.map{min-height:920px}.place{position:relative!important;inset:auto!important;margin:15px auto}}
</style>
</head>
<body><main><h1>Landkarte der Zauberreise</h1><div id="status">Die Runenkarte erwacht …</div><section class="map" id="map"></section><section class="discoveries"><h2>Fundorte und offene Entdeckungen</h2><div id="discoveries">Noch keine Entdeckungen verzeichnet.</div></section></main>
<script>
const q=new URLSearchParams(location.search),id=q.get("live"),api="https://zauberreise-live.d4wizzard.workers.dev",areas=[["Flüsterwald",1,"Mooswölfe und verborgene Pfade"],["Nebelmarkt",2,"Maskenhändler und Gassenkobolde"],["Runenruinen",3,"Golems und uralte Zeichen"],["Schattenkatakomben",5,"Knochenmagier und Wächter"],["Frostzahngebirge",7,"Riesen, Greife und Lawinen"],["Astralturm",9,"Sternenhexer und Zeitphantome"],["Obsidiantiefen",12,"Leerenweber und Kristallwürmer"],["Drachenödland",15,"Drachen, Titanen und Hydren"]],esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(p){const level=Number(p.Level)||1,here=p.SheetAdventure?.Place||"Schenke",open=p.OpenDiscovery||(p.LockedDiscovery?{name:p.LockedDiscovery,origin:p.LockedOrigin||"unbekanntes Gebiet",destination:p.LockedDestination||"unbekanntes Ziel",danger:Number(p.LockedDanger)||1,helpRequested:!!p.DiscoveryHelpRequested}:null),discoveries=Array.isArray(p.Discoveries)?[...p.Discoveries]:[];if(open){const entry=`🗝️ OFFEN · Fundort: ${open.name} in ${open.origin} → ${open.destination} (Gefahr ${open.danger}/6)`;if(!discoveries.some(x=>String(x).toLowerCase().includes(String(open.name).toLowerCase())&&String(x).toLowerCase().includes(String(open.destination).toLowerCase())))discoveries.unshift(entry)}document.getElementById("status").innerHTML=`@${esc(p.Name)} · Stufe ${level} · Aktueller Ort: <b>${esc(here)}</b> · Kartenfragmente ${Number(p.MapFragments)||0}/3`;document.getElementById("map").innerHTML=areas.map(([n,l,d],i)=>{const found=discoveries.filter(x=>String(x).toLowerCase().includes(` in ${n.toLowerCase()}`));return `<article class="place p${i+1} ${level<l?"locked":""} ${found.length?"discovered":""} ${here.toLowerCase().includes(n.toLowerCase())?"active":""}"><b>${n}</b><span>${level<l?"Gesperrt bis Stufe "+l:d}</span>${found.length?`<span class="pins">📍 ${found.length} Fundort${found.length===1?"":"e"}</span>`:""}</article>`}).join("");document.getElementById("discoveries").innerHTML=discoveries.length?`<ul>${discoveries.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"Noch keine Entdeckungen verzeichnet."}
async function refresh(){if(!id)return;try{const r=await fetch(`${api}/api/state/${id}`,{cache:"no-store"});if(!r.ok)throw 0;render((await r.json()).state)}catch{document.getElementById("status").textContent="Die Live-Karte ist noch nicht verfügbar."}}refresh();setInterval(refresh,8000);
</script></body></html>
