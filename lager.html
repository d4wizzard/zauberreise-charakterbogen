<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gruppenlager der Zauberreise</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f0e4c7;font-family:Georgia,serif;background:radial-gradient(circle at 50% 70%,#54331f,#172029 55%,#080d12)}main{width:min(900px,calc(100% - 28px));margin:auto;padding:34px}h1{color:#e7bc67;text-align:center}.camp{padding:28px;border:5px double #987044;background:#17191bd9;box-shadow:0 18px 50px #000}.fire{text-align:center;font-size:5rem}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{padding:16px;border:1px solid #82663e;background:#25221ddd}.card b{display:block;color:#f0cb79}.card span{display:block;margin-top:7px;color:#c9bea8}.links{text-align:center;margin-top:24px}.links a{color:#f0cb79}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>⛺ Das Gruppenlager</h1><section class="camp"><div class="fire">🔥</div><div id="state">Die Späher suchen nach dem Lagerfeuer …</div><div class="grid" id="grid"></div><p class="links"><a id="back" href="index.html">Zum Charakterbogen</a> · <a id="map" href="karte.html">Zur Live-Karte</a></p></section></main><script>const q=new URLSearchParams(location.search),id=q.get("live"),api="https://zauberreise-live.d4wizzard.workers.dev",esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));if(id){document.getElementById("map").href=`karte.html?live=${encodeURIComponent(id)}`}function render(p){const c=p.NarrativeSystems?.Camp||{},a=p.SheetAdventure||{},allies=a.Allies||[];document.getElementById("state").innerHTML=c.Active?`<h2>${esc(c.Place||"Unterwegs")}</h2><p>Runde ${Number(c.Round)||0} · Formation ${esc(c.Formation||"standard")} · gemeinsamer Vorrat ${Number(c.Provisions)||0} Rationen</p>`:'<h2>Kein Lager errichtet</h2><p>Der Charakter befindet sich derzeit in keiner aktiven Abenteuergruppe.</p>';document.getElementById("grid").innerHTML=allies.map(x=>`<article class="card"><b>${x.IsLeader?"♛ ":""}@${esc(x.Name)}</b><span>${Number(x.Hp)||0}/${Number(x.MaxHp)||0} LP · ${esc(x.Role||x.CharacterClass||"Abenteurer")}</span><span>${x.Companion?"🐾 "+esc(x.Companion.Name||x.Companion.Type):"ohne aktiven Begleiter"}</span></article>`).join("")||'<article class="card"><b>Leere Feuerstelle</b><span>Noch keine Gruppenmitglieder im Live-Stand.</span></article>'}async function refresh(){if(!id)return;try{const r=await fetch(`${api}/api/state/${id}`,{cache:"no-store"});if(!r.ok)throw 0;render((await r.json()).state)}catch{document.getElementById("state").textContent="Das Gruppenlager ist noch nicht erreichbar."}}refresh();setInterval(refresh,8000)</script></body></html>
